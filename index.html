<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adda — Chat Karo Azaad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1B1E;
    --bg-panel:#142428;
    --bg-input:#1B2E33;
    --lantern:#E8A33D;
    --lantern-soft:#E8A33D33;
    --rose:#D96C6C;
    --mint:#3FA796;
    --text:#F5EFE6;
    --text-dim:#9FB3AE;
    --line:#22383D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #E8A33D14, transparent 40%),
      radial-gradient(circle at 85% 90%, #3FA79614, transparent 40%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow:hidden;
  }
  h1,h2,h3,.brand{ font-family:'Space Grotesk',sans-serif; }

  /* ---------- LOGIN SCREEN ---------- */
  #loginScreen{
    display:flex; align-items:center; justify-content:center;
    height:100vh; padding:20px;
  }
  .login-card{
    background:var(--bg-panel);
    border:1px solid var(--line);
    border-radius:20px;
    padding:40px 36px;
    max-width:400px;
    width:100%;
    text-align:center;
    position:relative;
    box-shadow:0 20px 60px #00000055;
  }
  .lantern-dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--lantern);
    box-shadow:0 0 20px 6px var(--lantern-soft);
    margin:0 auto 18px;
    animation:glow 2.4s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{ box-shadow:0 0 14px 4px var(--lantern-soft); }
    50%{ box-shadow:0 0 26px 10px var(--lantern-soft); }
  }
  .login-card h1{ font-size:32px; letter-spacing:-0.5px; margin-bottom:6px; }
  .login-card p.tag{ color:var(--text-dim); font-size:14px; margin-bottom:28px; }
  .login-card input{
    width:100%;
    background:var(--bg-input);
    border:1px solid var(--line);
    color:var(--text);
    padding:14px 16px;
    border-radius:12px;
    font-size:15px;
    margin-bottom:14px;
    outline:none;
    transition:border-color .2s;
    font-family:'Inter',sans-serif;
  }
  .login-card input:focus{ border-color:var(--lantern); }
  .login-card button{
    width:100%;
    background:linear-gradient(135deg, var(--lantern), #d18a28);
    color:#1a1206;
    border:none;
    padding:14px;
    border-radius:12px;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  .login-card button:hover{ transform:translateY(-1px); box-shadow:0 8px 24px #E8A33D44; }
  .login-card button:disabled{ opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }
  .login-hint{ color:var(--text-dim); font-size:12px; margin-top:16px; line-height:1.6; }

  /* ---------- APP LAYOUT ---------- */
  #app{ display:none; height:100vh; }
  .shell{ display:flex; height:100vh; }

  /* Sidebar */
  .sidebar{
    width:280px;
    background:var(--bg-panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    flex-shrink:0;
  }
  .sidebar-header{
    padding:22px 20px 16px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; gap:10px;
  }
  .sidebar-header .lantern-dot{ margin:0; }
  .sidebar-header h1{ font-size:20px; }
  .me-row{
    padding:14px 20px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid var(--line);
  }
  .avatar{
    width:34px; height:34px; border-radius:50%;
    background:linear-gradient(135deg, var(--mint), #2a7a6d);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:14px; color:#0a1613;
    flex-shrink:0;
  }
  .me-name{ font-weight:600; font-size:14px; }
  .me-sub{ font-size:11px; color:var(--text-dim); }

  .rooms-label{
    padding:16px 20px 8px;
    font-size:11px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--text-dim);
    font-weight:600;
  }
  .rooms-list{ flex:1; overflow-y:auto; padding:0 10px; }
  .room-item{
    display:flex; align-items:center; gap:10px;
    padding:11px 12px;
    border-radius:10px;
    cursor:pointer;
    color:var(--text-dim);
    font-size:14px;
    font-weight:500;
    transition:background .15s, color .15s;
    margin-bottom:2px;
  }
  .room-item:hover{ background:#1B2E3388; color:var(--text); }
  .room-item.active{ background:var(--lantern-soft); color:var(--lantern); }
  .room-item .hash{ font-family:'Space Grotesk',sans-serif; opacity:0.6; }

  .online-panel{
    border-top:1px solid var(--line);
    padding:14px 20px 18px;
    max-height:160px;
    overflow-y:auto;
  }
  .online-panel .rooms-label{ padding:0 0 8px; }
  .online-user{
    display:flex; align-items:center; gap:8px;
    font-size:13px;
    color:var(--text-dim);
    padding:4px 0;
  }
  .online-user .pulse{
    width:7px; height:7px; border-radius:50%;
    background:var(--mint);
    box-shadow:0 0 6px 2px #3FA79655;
  }

  /* Main chat area */
  .main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .chat-header{
    padding:18px 28px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg-panel);
  }
  .chat-header h2{ font-size:17px; }
  .chat-header .sub{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .logout-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:10px; font-size:12px; cursor:pointer;
    font-family:'Inter',sans-serif;
    transition:border-color .15s, color .15s;
  }
  .logout-btn:hover{ border-color:var(--rose); color:var(--rose); }

  .messages{
    flex:1;
    overflow-y:auto;
    padding:24px 28px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg-row{ display:flex; gap:10px; max-width:70%; }
  .msg-row.mine{ align-self:flex-end; flex-direction:row-reverse; }
  .msg-avatar{
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg, #E8A33D, #b9781f);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:12px; color:#1a1206;
    flex-shrink:0;
  }
  .msg-row.mine .msg-avatar{ background:linear-gradient(135deg, var(--mint), #2a7a6d); color:#0a1613; }
  .msg-body{ min-width:0; }
  .msg-meta{ font-size:11px; color:var(--text-dim); margin-bottom:4px; display:flex; gap:6px; }
  .msg-row.mine .msg-meta{ justify-content:flex-end; }
  .msg-bubble{
    background:var(--bg-input);
    padding:10px 14px;
    border-radius:14px 14px 14px 4px;
    font-size:14px;
    line-height:1.5;
    word-wrap:break-word;
    border:1px solid var(--line);
  }
  .msg-row.mine .msg-bubble{
    background:linear-gradient(135deg, #1c3d38, #17322e);
    border-radius:14px 14px 4px 14px;
    border-color:#2a4d47;
  }
  .msg-empty{
    margin:auto;
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
  }

  .composer{
    padding:18px 28px 24px;
    border-top:1px solid var(--line);
    display:flex; gap:10px;
    background:var(--bg-panel);
  }
  .composer input{
    flex:1;
    background:var(--bg-input);
    border:1px solid var(--line);
    color:var(--text);
    padding:13px 16px;
    border-radius:12px;
    font-size:14px;
    outline:none;
    font-family:'Inter',sans-serif;
    transition:border-color .2s;
  }
  .composer input:focus{ border-color:var(--lantern); }
  .composer button{
    background:linear-gradient(135deg, var(--lantern), #d18a28);
    color:#1a1206;
    border:none;
    padding:0 22px;
    border-radius:12px;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform .15s;
  }
  .composer button:hover{ transform:translateY(-1px); }
  .composer button:disabled{ opacity:0.4; cursor:not-allowed; transform:none; }

  ::-webkit-scrollbar{ width:8px; }
  ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  @media (max-width: 720px){
    .sidebar{ position:fixed; z-index:20; height:100vh; transform:translateX(-100%); transition:transform .2s; }
    .sidebar.open{ transform:translateX(0); }
    .main{ width:100%; }
    .msg-row{ max-width:88%; }
    .menu-btn{ display:inline-flex !important; }
  }
  .menu-btn{
    display:none;
    background:none; border:1px solid var(--line); color:var(--text);
    width:34px; height:34px; border-radius:8px; align-items:center; justify-content:center;
    cursor:pointer; margin-right:10px; font-size:16px;
  }

  @media (prefers-reduced-motion: reduce){
    .lantern-dot{ animation:none; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="loginScreen">
  <div class="login-card">
    <div class="lantern-dot"></div>
    <h1>Adda</h1>
    <p class="tag">Apna naam do, adda shuru karo.</p>
    <input type="text" id="nameInput" placeholder="Apna naam likho..." maxlength="20" autocomplete="off">
    <button id="enterBtn" onclick="enterChat()">Adda Join Karo</button>
    <p class="login-hint">Koi password nahi chahiye. Naam likho aur seedha chat mein pahunch jao.</p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app">
  <div class="shell">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="lantern-dot"></div>
        <h1>Adda</h1>
      </div>
      <div class="me-row">
        <div class="avatar" id="myAvatar">?</div>
        <div>
          <div class="me-name" id="myName">—</div>
          <div class="me-sub">Online hai</div>
        </div>
      </div>
      <div class="rooms-label">Rooms</div>
      <div class="rooms-list" id="roomsList"></div>
      <div class="online-panel">
        <div class="rooms-label">Is Room Mein Online</div>
        <div id="onlineList"></div>
      </div>
    </div>

    <div class="main">
      <div class="chat-header">
        <div style="display:flex; align-items:center;">
          <button class="menu-btn" id="menuBtn" onclick="toggleSidebar()">☰</button>
          <div>
            <h2 id="roomTitle"># karachi-adda</h2>
            <div class="sub" id="roomSub">General baatein, sab ke liye</div>
          </div>
        </div>
        <button class="logout-btn" onclick="logout()">Nikal Jao</button>
      </div>

      <div class="messages" id="messages">
        <div class="msg-empty">Messages load ho rahe hain...</div>
      </div>

      <div class="composer">
        <input type="text" id="msgInput" placeholder="Kuch likho..." maxlength="500" autocomplete="off">
        <button id="sendBtn" onclick="sendMessage()">Bhejo</button>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
/* =========================================================
   ADDA — REAL-TIME CHAT
   Isse chalane ke liye apna Firebase config yahan daalo.
   Firebase Console > Project Settings > General > Your apps
   ========================================================= */
const firebaseConfig = {
  apiKey: "AIzaSyBf-Pqipw_m8TfFmwSXOqEM9nmesVs4QcM",
  authDomain: "taskyaar-a925b.firebaseapp.com",
  projectId: "taskyaar-a925b",
  storageBucket: "taskyaar-a925b.firebasestorage.app",
  messagingSenderId: "396863993634",
  appId: "1:396863993634:web:12618a216d14b497e1977b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// ---- Rooms config ----
const ROOMS = [
  { id: "karachi-adda", label: "karachi-adda", sub: "General baatein, sab ke liye" },
  { id: "pubg-squad",   label: "pubg-squad",   sub: "Squad-up aur strategy talk" },
  { id: "business-talk",label: "business-talk",sub: "Freelancing, ecommerce, hustle" },
  { id: "tech-help",    label: "tech-help",    sub: "Code, tools, aur troubleshoot" }
];

let currentUser = null;
let currentRoom = "karachi-adda";
let unsubMessages = null;
let unsubPresence = null;
let presenceRef = null;
let presenceInterval = null;

// ---- Login ----
function enterChat(){
  const name = document.getElementById('nameInput').value.trim();
  if(!name){ document.getElementById('nameInput').focus(); return; }
  currentUser = {
    name: name,
    id: name.toLowerCase().replace(/\s+/g,'-') + '-' + Math.random().toString(36).slice(2,7)
  };
  localStorage.setItem('adda_user', JSON.stringify(currentUser));
  startApp();
}

document.getElementById('nameInput').addEventListener('keydown', e=>{
  if(e.key === 'Enter') enterChat();
});

function logout(){
  if(presenceRef) presenceRef.delete().catch(()=>{});
  if(presenceInterval) clearInterval(presenceInterval);
  localStorage.removeItem('adda_user');
  location.reload();
}

// ---- App bootstrap ----
function startApp(){
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('myName').textContent = currentUser.name;
  document.getElementById('myAvatar').textContent = currentUser.name.charAt(0).toUpperCase();

  renderRooms();
  joinRoom(currentRoom);
  markPresence();
  presenceInterval = setInterval(markPresence, 20000);

  document.getElementById('msgInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') sendMessage();
  });

  window.addEventListener('beforeunload', ()=>{
    if(presenceRef) presenceRef.delete().catch(()=>{});
  });
}

function renderRooms(){
  const list = document.getElementById('roomsList');
  list.innerHTML = '';
  ROOMS.forEach(r=>{
    const div = document.createElement('div');
    div.className = 'room-item' + (r.id === currentRoom ? ' active' : '');
    div.innerHTML = `<span class="hash">#</span> ${r.label}`;
    div.onclick = ()=> joinRoom(r.id);
    list.appendChild(div);
  });
}

function joinRoom(roomId){
  currentRoom = roomId;
  renderRooms();
  const room = ROOMS.find(r=>r.id===roomId);
  document.getElementById('roomTitle').textContent = '# ' + room.label;
  document.getElementById('roomSub').textContent = room.sub;
  document.getElementById('messages').innerHTML = '<div class="msg-empty">Messages load ho rahe hain...</div>';

  if(unsubMessages) unsubMessages();
  listenMessages(roomId);

  markPresence();
  if(unsubPresence) unsubPresence();
  listenPresence(roomId);

  if(window.innerWidth <= 720) document.getElementById('sidebar').classList.remove('open');
}

// ---- Messages (Firestore) ----
function listenMessages(roomId){
  unsubMessages = db.collection('adda_rooms').doc(roomId)
    .collection('messages')
    .orderBy('createdAt','asc')
    .limitToLast(100)
    .onSnapshot(snapshot=>{
      const container = document.getElementById('messages');
      if(snapshot.empty){
        container.innerHTML = '<div class="msg-empty">Abhi koi message nahi. Pehla message tum bhejo!</div>';
        return;
      }
      container.innerHTML = '';
      snapshot.forEach(doc=>{
        const m = doc.data();
        container.appendChild(renderMessage(m));
      });
      container.scrollTop = container.scrollHeight;
    }, err=>{
      document.getElementById('messages').innerHTML =
        '<div class="msg-empty">Firebase connect nahi ho raha. Config check karo.</div>';
      console.error(err);
    });
}

function renderMessage(m){
  const row = document.createElement('div');
  const mine = currentUser && m.userId === currentUser.id;
  row.className = 'msg-row' + (mine ? ' mine' : '');
  const time = m.createdAt && m.createdAt.toDate ? formatTime(m.createdAt.toDate()) : '';
  row.innerHTML = `
    <div class="msg-avatar">${(m.userName||'?').charAt(0).toUpperCase()}</div>
    <div class="msg-body">
      <div class="msg-meta"><span>${escapeHtml(m.userName||'Unknown')}</span><span>${time}</span></div>
      <div class="msg-bubble">${escapeHtml(m.text)}</div>
    </div>
  `;
  return row;
}

function sendMessage(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text || !currentUser) return;
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;

  db.collection('adda_rooms').doc(currentRoom).collection('messages').add({
    text: text,
    userId: currentUser.id,
    userName: currentUser.name,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(()=>{
    input.value = '';
  }).catch(err=>{
    alert('Message nahi bheja gaya. Firebase config check karo.');
    console.error(err);
  }).finally(()=>{
    btn.disabled = false;
    input.focus();
  });
}

// ---- Presence ----
function markPresence(){
  if(!currentUser) return;
  presenceRef = db.collection('adda_rooms').doc(currentRoom)
    .collection('presence').doc(currentUser.id);
  presenceRef.set({
    userName: currentUser.name,
    lastSeen: firebase.firestore.FieldValue.serverTimestamp()
  }).catch(err=>console.error(err));
}

function listenPresence(roomId){
  unsubPresence = db.collection('adda_rooms').doc(roomId).collection('presence')
    .onSnapshot(snapshot=>{
      const list = document.getElementById('onlineList');
      list.innerHTML = '';
      const now = Date.now();
      let count = 0;
      snapshot.forEach(doc=>{
        const p = doc.data();
        const lastSeen = p.lastSeen && p.lastSeen.toDate ? p.lastSeen.toDate().getTime() : 0;
        if(now - lastSeen < 60000){ // active in last 60s
          count++;
          const row = document.createElement('div');
          row.className = 'online-user';
          row.innerHTML = `<span class="pulse"></span> ${escapeHtml(p.userName)}`;
          list.appendChild(row);
        }
      });
      if(count === 0){
        list.innerHTML = '<div class="online-user" style="opacity:.6">Koi online nahi</div>';
      }
    });
}

// ---- Helpers ----
function formatTime(date){
  return date.toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
}
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('open');
}

// ---- Auto-login if user already saved ----
(function init(){
  const saved = localStorage.getItem('adda_user');
  if(saved){
    try{
      currentUser = JSON.parse(saved);
      startApp();
    }catch(e){
      localStorage.removeItem('adda_user');
    }
  }
})();
</script>
</body>
</html>
